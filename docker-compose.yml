services:

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    ports:
      - "8000:8000"
    networks:
      - restaurant-network

  order-service:
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8001:8000"
    networks:
      - restaurant-network
    depends_on:
      - product-service

networks:
  restaurant-network:
    driver: bridge
