services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant-dev-password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [restaurant-network]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [restaurant-network]
  product-service:
    build: ./product-service
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://restaurant:restaurant-dev-password@postgres:5432/restaurant
    depends_on:
      postgres:
        condition: service_healthy
    networks: [restaurant-network]
  user-service:
    build: ./user-service
    ports: ["8002:8000"]
    environment:
      JWT_SECRET: development-secret-change-in-production
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://restaurant:restaurant-dev-password@postgres:5432/restaurant
    depends_on:
      postgres:
        condition: service_healthy
    networks: [restaurant-network]
  order-service:
    build: ./order-service
    ports: ["8001:8000"]
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JWT_SECRET: development-secret-change-in-production
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://restaurant:restaurant-dev-password@postgres:5432/restaurant
    depends_on:
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [restaurant-network]
  payment-service:
    build: ./payment-service
    ports: ["8003:8000"]
    environment: { AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F }
    depends_on: [rabbitmq]
    networks: [restaurant-network]
  notification-service:
    build: ./notification-service
    ports: ["8004:8000"]
    environment: { AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F }
    depends_on: [rabbitmq]
    networks: [restaurant-network]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5178:5178"]
    environment:
      VITE_PRODUCT_API_URL: http://localhost:8000
      VITE_ORDER_API_URL: http://localhost:8001
    depends_on: [product-service, order-service, user-service]
    networks: [restaurant-network]
networks:
  restaurant-network:
    driver: bridge
volumes:
  postgres-data:
