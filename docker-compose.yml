services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    networks: [restaurant-network]
  product-service:
    build: ./product-service
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
    networks: [restaurant-network]
  user-service:
    build: ./user-service
    ports: ["8002:8000"]
    environment:
      JWT_SECRET: development-secret-change-in-production
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
    networks: [restaurant-network]
  order-service:
    build: ./order-service
    ports: ["8001:8000"]
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JWT_SECRET: development-secret-change-in-production
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5173,http://127.0.0.1:5173
    depends_on: [rabbitmq, product-service]
    networks: [restaurant-network]
  payment-service:
    build: ./payment-service
    ports: ["8003:8000"]
    environment: { AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F }
    depends_on: [rabbitmq]
    networks: [restaurant-network]
  notification-service:
    build: ./notification-service
    ports: ["8004:8000"]
    environment: { AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F }
    depends_on: [rabbitmq]
    networks: [restaurant-network]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5178:5178"]
    environment:
      VITE_PRODUCT_API_URL: http://localhost:8000
      VITE_ORDER_API_URL: http://localhost:8001
    depends_on: [product-service, order-service, user-service]
    networks: [restaurant-network]
networks:
  restaurant-network:
    driver: bridge
